version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hr_vue2_compare_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hr_management_vue2_docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-hr_vue2_root_password}
      MYSQL_USER: ${DB_USERNAME:-hr_vue2_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hr_vue2_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hr_vue2_compare_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-hr_vue2_root_password}"]
      timeout: 20s
      retries: 20

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hr_vue2_compare_backend
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_NAME: "Satoripop RH Vue2 Compare"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://187.124.184.74:3001
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hr_management_vue2_docker}
      DB_USERNAME: ${DB_USERNAME:-hr_vue2_user}
      DB_PASSWORD: ${DB_PASSWORD:-hr_vue2_password}
      JWT_SECRET: ${JWT_SECRET:-hr-vue2-compare-jwt-secret-change-me}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      REDIS_HOST: redis
    expose:
      - "80"
    volumes:
      - ./server:/var/www
      - backend_vendor:/var/www/vendor
      - ./server/storage:/var/www/storage
      - ./server/bootstrap/cache:/var/www/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hr_vue2_compare_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development-stage
    container_name: hr_vue2_compare_frontend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      CHOKIDAR_USEPOLLING: "true"
      VUE_APP_API_URL: /api
      VUE_APP_BASE_URL: http://187.124.184.74:3001
    ports:
      - "3001:8080"
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - hr_vue2_compare_network

  redis:
    image: redis:alpine
    container_name: hr_vue2_compare_redis
    restart: unless-stopped
    networks:
      - hr_vue2_compare_network

volumes:
  mysql_data:
    driver: local
  backend_vendor:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  hr_vue2_compare_network:
    driver: bridge
